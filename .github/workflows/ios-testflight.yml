name: iOS-app naar TestFlight

on:
  # Elke push naar main die de app raakt, bouwt een nieuwe TestFlight-build.
  # Het buildnummer komt uit App Store Connect, dus pubspec ophogen hoeft niet.
  # Wijzigingen aan alleen de website starten deze workflow niet.
  push:
    branches:
      - main
    paths:
      - "mobile/**"
      - ".github/workflows/ios-testflight.yml"
      - ".github/workflows/scripts/**"
  workflow_dispatch:
    inputs:
      build_name:
        description: "Versie (bijv. 1.0.3). Leeg = automatisch uit pubspec.yaml + App Store Connect."
        required: false
        default: ""
      build_number:
        description: "Buildnummer (bijv. 46). Leeg = automatisch uit App Store Connect."
        required: false
        default: ""

# Een nieuwere push vervangt een build die nog loopt.
concurrency:
  group: ios-testflight
  cancel-in-progress: true

jobs:
  # Zonder Apple-secrets slaan we de (dure) macOS-build netjes over in plaats
  # van rood te worden. Zie mobile/README.md voor de lijst met secrets.
  check:
    name: Secrets aanwezig?
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          ASC_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          if [ -n "$ASC_KEY" ] && [ -n "$KEY_ID" ] && [ -n "$ISSUER" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Apple-secrets ontbreken nog; TestFlight-build overgeslagen. Zie mobile/README.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Analyse en tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.0"
          channel: stable
          cache: true
      - name: Afhankelijkheden
        working-directory: mobile
        run: flutter pub get
      - name: Analyse
        working-directory: mobile
        run: flutter analyze --no-fatal-infos
      - name: Tests
        working-directory: mobile
        run: flutter test

  build-and-upload-ios:
    name: Flutter IPA bouwen en naar TestFlight
    needs: [check, test]
    if: needs.check.outputs.ready == 'true'
    runs-on: macos-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # ── 2. Flutter ───────────────────────────────────────────────────────────
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.0"
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        working-directory: mobile
        run: flutter pub get

      # ── 3. Code signing ──────────────────────────────────────────────────────
      # Ondertekenen gaat volledig automatisch via de App Store Connect API-sleutel
      # (rol Admin): xcodebuild -allowProvisioningUpdates maakt of hergebruikt het
      # door Apple beheerde distributiecertificaat en het App Store-profiel.
      # Geen .p12 of .mobileprovision nodig (zelfde aanpak als CamTrip).
      #
      # Secrets:
      #   APP_STORE_CONNECT_KEY_ID, APP_STORE_CONNECT_ISSUER_ID
      #   APP_STORE_CONNECT_API_KEY_P8  inhoud van de .p8 (tekst of base64)
      - name: Install App Store Connect API key
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          set -euo pipefail
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$KEY_DIR"
          KEY_PATH="$KEY_DIR/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          # Accepteert de .p8-tekst (met of zonder regeleinden) of base64 daarvan
          # en schrijft altijd een nette PEM: xcodebuild accepteert niets anders.
          RAW="$APP_STORE_CONNECT_API_KEY_P8"
          if ! printf '%s' "$RAW" | grep -q "BEGIN PRIVATE KEY"; then
            RAW=$(printf '%s' "$RAW" | tr -d ' \r\n' | base64 --decode)
          fi
          BODY=$(printf '%s' "$RAW" | sed -e 's/-----BEGIN PRIVATE KEY-----//' -e 's/-----END PRIVATE KEY-----//' | tr -d ' \r\n\t')
          {
            echo "-----BEGIN PRIVATE KEY-----"
            printf '%s' "$BODY" | fold -w 64
            echo
            echo "-----END PRIVATE KEY-----"
          } > "$KEY_PATH"
          openssl pkey -in "$KEY_PATH" -noout && echo "API-sleutel is een geldige PEM."
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      # ── 3b. Versie bepalen ───────────────────────────────────────────────────
      # Vraagt App Store Connect welke versie/build al bestaan en kiest de
      # volgende vrije, zodat een vergeten pubspec-bump de upload niet breekt.
      - name: Resolve version and build number
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          APP_BUNDLE_ID: com.abonnementenbeheren.app
          INPUT_BUILD_NAME: ${{ github.event.inputs.build_name }}
          INPUT_BUILD_NUMBER: ${{ github.event.inputs.build_number }}
          PUBSPEC_PATH: mobile/pubspec.yaml
        run: |
          python3 -m venv "$RUNNER_TEMP/versionvenv"
          "$RUNNER_TEMP/versionvenv/bin/python" -m pip install --quiet --disable-pip-version-check pyjwt cryptography
          "$RUNNER_TEMP/versionvenv/bin/python" .github/workflows/scripts/resolve_version.py

      # ── 4. ExportOptions ─────────────────────────────────────────────────────
      - name: Create ExportOptions.plist
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>4K4D59MXKW</string>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF

      # ── 5. Build IPA ─────────────────────────────────────────────────────────
      - name: Build Flutter iOS (unsigned)
        working-directory: mobile
        env:
          REVENUECAT_APPLE_KEY: ${{ secrets.REVENUECAT_APPLE_KEY }}
        run: |
          echo "Building $BUILD_NAME ($BUILD_NUMBER)"
          # De publieke RevenueCat-sleutel staat als standaard in config.dart;
          # het secret is alleen nodig om die te overschrijven.
          EXTRA_DEFINES=()
          if [ -n "${REVENUECAT_APPLE_KEY:-}" ]; then
            EXTRA_DEFINES+=(--dart-define=REVENUECAT_APPLE_KEY="$REVENUECAT_APPLE_KEY")
          fi

          flutter build ios --release --no-codesign \
            --build-name="$BUILD_NAME" \
            --build-number="$BUILD_NUMBER" \
            "${EXTRA_DEFINES[@]}"

      - name: Archive and export signed IPA
        working-directory: mobile/ios
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          AUTH=(-allowProvisioningUpdates
                -authenticationKeyPath "$ASC_KEY_PATH"
                -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID"
                -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID")

          xcodebuild -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            "${AUTH[@]}" \
            archive \
            DEVELOPMENT_TEAM=4K4D59MXKW \
            CODE_SIGN_STYLE=Automatic

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath ../build/ios/ipa \
            "${AUTH[@]}"

          IPA_PATH=$(find ../build/ios/ipa -name "*.ipa" | head -1)
          if [ -z "${IPA_PATH:-}" ]; then
            echo "No IPA file produced."
            exit 1
          fi

      # ── 6. Upload naar TestFlight ───────────────────────────────────────────
      #   APP_STORE_CONNECT_KEY_ID / _ISSUER_ID / _API_KEY_P8 (.p8-tekst of base64 daarvan)
      - name: Upload IPA to TestFlight
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          set -euo pipefail

          # De sleutel staat al klaar uit stap 3 (altool zoekt in ~/.appstoreconnect).
          IPA_PATH=$(find mobile/build/ios/ipa -name "*.ipa" | head -1)
          echo "Uploading: $IPA_PATH"

          # altool kan 0 teruggeven terwijl Apple de build weigert; daarom de
          # uitvoer controleren.
          UPLOAD_LOG="$RUNNER_TEMP/altool-upload.log"
          set +e
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --verbose 2>&1 | tee "$UPLOAD_LOG"
          ALTOOL_EXIT=${PIPESTATUS[0]}
          set -e

          if [ "$ALTOOL_EXIT" -ne 0 ] || grep -qiE "UPLOAD FAILED|Failed to upload package|ERROR:" "$UPLOAD_LOG"; then
            REASON=$(awk -F'"' '/description/ {print $(NF-1)}' "$UPLOAD_LOG" | sort -u | head -5)
            echo "::error::TestFlight-upload mislukt als $BUILD_NAME ($BUILD_NUMBER)."
            if [ -n "${REASON:-}" ]; then
              echo "$REASON" | while read -r line; do echo "::error::$line"; done
            fi
            exit 1
          fi
          echo "Upload geaccepteerd door App Store Connect."

      # ── 7. Opruimen ─────────────────────────────────────────────────────────
      - name: Clean up API key
        if: always()
        run: |
          rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8"
